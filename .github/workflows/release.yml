name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Verify release source and metadata
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          fetch-depth: 0

      - name: Require tag at green main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "::error::Release tag must point at current origin/main ($MAIN_COMMIT), got $TAG_COMMIT."
            exit 1
          fi

          CI_RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$TAG_COMMIT&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::No successful completed main CI run exists for release commit $TAG_COMMIT. Push main and wait for CI before tagging."
            exit 1
          fi
          echo "Release commit $TAG_COMMIT is current main with successful CI run $CI_RUN_ID."

      - name: Verify tag, AppVersion, changelog, and plist
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          APPVER="$(sed -nE 's/^[[:space:]]*AppVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' go_module/main.go | sed -n '1p')"
          MARKETING_VERSION="$(python3 -c 'import plistlib; print(plistlib.load(open("macos/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          BUNDLE_VERSION="$(python3 -c 'import plistlib; print(plistlib.load(open("macos/Info.plist", "rb"))["CFBundleVersion"])')"
          TAG_MARKETING="${TAG%%-*}"

          if [ -z "$APPVER" ] || [ "$TAG" != "$APPVER" ]; then
            echo "::error::Tag '$TAG' does not match AppVersion '$APPVER'."
            exit 1
          fi
          if [ "$MARKETING_VERSION" != "$TAG_MARKETING" ]; then
            echo "::error::CFBundleShortVersionString '$MARKETING_VERSION' does not match tag marketing version '$TAG_MARKETING'."
            exit 1
          fi
          if [[ ! "$BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CFBundleVersion must be a positive monotonic integer, got '$BUNDLE_VERSION'."
            exit 1
          fi
          if ! grep -Fq "## [$TAG] — " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no release heading for $TAG."
            exit 1
          fi

          echo "Tag/AppVersion: $TAG"
          echo "macOS marketing/build: $MARKETING_VERSION ($BUNDLE_VERSION)"

  build:
    name: Build ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            binary: mbii-foundry
            archive_ext: tar.gz
            arch: amd64
          - os: macos-latest
            name: macos-universal
            binary: mbii-foundry
            archive_ext: zip
            arch: universal
          - os: windows-latest
            name: windows-amd64
            binary: mbii-foundry.exe
            archive_ext: zip
            arch: amd64
    defaults:
      run:
        working-directory: go_module
    steps:
      - uses: actions/checkout@924ae3a1cded613372ab5595356fb5720e22ba16 # v6

      - uses: actions/setup-go@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go_module/go.sum

      - name: Require canonical publisher public key
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
        run: |
          if [[ ! "$PUBLISHER_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::PUBLISHER_PUBLIC_KEY must be exactly 64 lowercase hexadecimal characters."
            exit 1
          fi

      - name: Install Fyne system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libasound2-dev \
            libxxf86vm-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          GOOS=linux GOARCH="$RELEASE_ARCH" go build -v -o "${{ matrix.binary }}" -ldflags="-s -w -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          case "$(go version -m "${{ matrix.binary }}")" in
            *"GOARCH=$RELEASE_ARCH"*"GOOS=linux"*) ;;
            *) echo "::error::Linux artifact architecture does not match linux/$RELEASE_ARCH"; exit 1 ;;
          esac

      - name: Build (Windows, GUI mode)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          GOOS=windows GOARCH="$RELEASE_ARCH" go build -v -o "${{ matrix.binary }}" -ldflags="-s -w -H=windowsgui -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          case "$(go version -m "${{ matrix.binary }}")" in
            *"GOARCH=$RELEASE_ARCH"*"GOOS=windows"*) ;;
            *) echo "::error::Windows artifact architecture does not match windows/$RELEASE_ARCH"; exit 1 ;;
          esac

      - name: Build macOS (Universal)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" CXX="clang++ -arch x86_64" \
            go build -v -o mbii-foundry_amd64 -ldflags="-s -w -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" CXX="clang++ -arch arm64" \
            go build -v -o mbii-foundry_arm64 -ldflags="-s -w -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          test "$(lipo -archs mbii-foundry_amd64)" = "x86_64"
          test "$(lipo -archs mbii-foundry_arm64)" = "arm64"
          lipo -create -output mbii-foundry mbii-foundry_amd64 mbii-foundry_arm64
          lipo mbii-foundry -verify_arch x86_64 arm64
          ARCHS="$(lipo -archs mbii-foundry)"
          test "$(wc -w <<<"$ARCHS" | tr -d ' ')" = "2"

      - name: Package macOS .app bundle (ad-hoc alpha)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          APP_BUNDLE="MBII Foundry.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp go_module/mbii-foundry "$APP_BUNDLE/Contents/MacOS/"
          cp macos/Info.plist "$APP_BUNDLE/Contents/"
          cp macos/AppIcon.icns "$APP_BUNDLE/Contents/Resources/"
          for dir in data definitions schemas templates; do
            if [ ! -d "$dir" ]; then
              echo "::error::Required release resource directory '$dir' is missing."
              exit 1
            fi
            cp -R "$dir" "$APP_BUNDLE/Contents/Resources/"
          done
          echo "::warning::Signing AD-HOC for this alpha: no Apple publisher identity and no notarization."
          codesign -s - -f --deep --strict "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"
          zip -qr "mbii-foundry-${{ matrix.name }}.zip" "$APP_BUNDLE"

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          mkdir -p dist
          cp go_module/mbii-foundry dist/
          cp README.md LICENSE USER_GUIDE.md dist/
          cp -r data definitions schemas templates dist/
          tar -czf "mbii-foundry-${{ matrix.name }}.tar.gz" -C dist .

      - name: Package Windows zip
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item go_module/mbii-foundry.exe dist/
          Copy-Item README.md, LICENSE, USER_GUIDE.md dist/
          Copy-Item -Recurse data, definitions, schemas, templates dist/
          Compress-Archive -Path dist/* -DestinationPath "mbii-foundry-${{ matrix.name }}.zip" -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-${{ matrix.name }}
          path: mbii-foundry-${{ matrix.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  sign:
    name: Verify publisher and sign manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@924ae3a1cded613372ab5595356fb5720e22ba16 # v6

      - uses: actions/setup-go@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go_module/go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unsigned-*
          path: unsigned
          merge-multiple: true

      - name: Verify keypair and sign all manifests
        shell: bash
        working-directory: go_module
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISHER_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::PUBLISHER_PUBLIC_KEY must be exactly 64 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ ! "$PUBLISHER_PRIVATE_KEY" =~ ^[0-9a-f]{128}$ ]]; then
            echo "::error::PUBLISHER_PRIVATE_KEY must be exactly 128 lowercase hexadecimal characters."
            exit 1
          fi

          umask 077
          KEY_DIR="$(mktemp -d)"
          SIGNER="$RUNNER_TEMP/mbii-foundry-signer"
          trap 'rm -rf "$KEY_DIR" "$SIGNER"' EXIT
          printf '%s' "$PUBLISHER_PUBLIC_KEY" > "$KEY_DIR/public.hex"
          printf '%s' "$PUBLISHER_PRIVATE_KEY" > "$KEY_DIR/private.hex"
          go build -o "$SIGNER" ./cmd/signer
          "$SIGNER" -verify-keypair \
            -key "$KEY_DIR/private.hex" \
            -public-key-file "$KEY_DIR/public.hex"

          "$SIGNER" -sign ../unsigned/mbii-foundry-linux-amd64.tar.gz \
            -key "$KEY_DIR/private.hex" -version "$GITHUB_REF_NAME" -platform linux -arch amd64
          "$SIGNER" -sign ../unsigned/mbii-foundry-macos-universal.zip \
            -key "$KEY_DIR/private.hex" -version "$GITHUB_REF_NAME" -platform darwin -arch universal
          "$SIGNER" -sign ../unsigned/mbii-foundry-windows-amd64.zip \
            -key "$KEY_DIR/private.hex" -version "$GITHUB_REF_NAME" -platform windows -arch amd64

          for file in \
            ../unsigned/mbii-foundry-linux-amd64.tar.gz \
            ../unsigned/mbii-foundry-linux-amd64.tar.gz.manifest.json \
            ../unsigned/mbii-foundry-macos-universal.zip \
            ../unsigned/mbii-foundry-macos-universal.zip.manifest.json \
            ../unsigned/mbii-foundry-windows-amd64.zip \
            ../unsigned/mbii-foundry-windows-amd64.zip.manifest.json; do
            test -s "$file" || { echo "::error::Missing release asset $file"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: |
            unsigned/mbii-foundry-linux-amd64.tar.gz
            unsigned/mbii-foundry-linux-amd64.tar.gz.manifest.json
            unsigned/mbii-foundry-macos-universal.zip
            unsigned/mbii-foundry-macos-universal.zip.manifest.json
            unsigned/mbii-foundry-windows-amd64.zip
            unsigned/mbii-foundry-windows-amd64.zip.manifest.json
          if-no-files-found: error

  release:
    name: Create draft GitHub prerelease
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-files
          path: artifacts

      - name: Require exactly six release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -maxdepth 1 -type f -print | sort)
          if [ "${#FILES[@]}" -ne 6 ]; then
            printf '::error::Expected exactly six release assets, found %s:\n' "${#FILES[@]}"
            printf '  %s\n' "${FILES[@]}"
            exit 1
          fi
          printf 'Release asset: %s\n' "${FILES[@]}"

      - name: Create draft release for explicit inspection and publication
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
