name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            binary: mbii-foundry
            archive_ext: tar.gz
            platform: linux
            arch: amd64
          - os: macos-latest
            name: macos-universal
            binary: mbii-foundry
            archive_ext: zip
            platform: darwin
            arch: universal
          - os: windows-latest
            name: windows-amd64
            binary: mbii-foundry.exe
            archive_ext: zip
            platform: windows
            arch: amd64
    defaults:
      run:
        working-directory: go_module
    steps:
      - uses: actions/checkout@v6

      - name: Verify AppVersion matches tag
        shell: bash
        # Guard: the AppVersion constant in main.go must match the tag
        # being released (minus the leading "v"). Without this check
        # we've had releases go out where the in-app "FOUNDRY v0.3.0"
        # footer and the GitHub tag said different things — which then
        # confused the in-app update checker into either spamming
        # "upgrade available" forever or never showing it. Fail fast
        # and force the person tagging to bump AppVersion in the same
        # commit.
        #
        # working-directory is scoped to the repo root here (overriding
        # the job-level `go_module` default) so the grep path reads
        # naturally; otherwise we'd double up as go_module/go_module/…
        working-directory: .
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APPVER=$(grep -E '^\s*AppVersion\s*=' go_module/main.go \
            | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag (without v): $TAG"
          echo "AppVersion:      $APPVER"
          if [ "$TAG" != "$APPVER" ]; then
            echo "::error::Tag '$TAG' does not match AppVersion '$APPVER' in go_module/main.go."
            echo "::error::Bump AppVersion to match the tag and re-tag, or retag to match AppVersion."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go_module/go.sum

      - name: Install Fyne system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libasound2-dev \
            libxxf86vm-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev

      # Every auto-update binary embeds this public key. Validate its exact
      # representation and prove it is derived from the signing key before any
      # platform build starts; a missing or mismatched key aborts the release.
      - name: Verify publisher keypair
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
        run: |
          if [[ ! "$PUBLISHER_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::PUBLISHER_PUBLIC_KEY must be exactly 64 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ ! "$PUBLISHER_PRIVATE_KEY" =~ ^[0-9a-f]{128}$ ]]; then
            echo "::error::PUBLISHER_PRIVATE_KEY must be exactly 128 lowercase hexadecimal characters."
            exit 1
          fi
          umask 077
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          printf '%s' "$PUBLISHER_PUBLIC_KEY" > "$KEY_DIR/public.hex"
          printf '%s' "$PUBLISHER_PRIVATE_KEY" > "$KEY_DIR/private.hex"
          go run ./cmd/signer -verify-keypair \
            -key "$KEY_DIR/private.hex" \
            -public-key-file "$KEY_DIR/public.hex"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          GOOS=linux GOARCH="$RELEASE_ARCH" go build -v -o "${{ matrix.binary }}" -ldflags="-s -w -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          case "$(go version -m "${{ matrix.binary }}")" in
            *"GOARCH=$RELEASE_ARCH"*"GOOS=linux"*) ;;
            *) echo "::error::Linux artifact architecture does not match linux/$RELEASE_ARCH"; exit 1 ;;
          esac

      - name: Build (Windows, GUI mode)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          GOOS=windows GOARCH="$RELEASE_ARCH" go build -v -o "${{ matrix.binary }}" -ldflags="-s -w -H=windowsgui -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          case "$(go version -m "${{ matrix.binary }}")" in
            *"GOARCH=$RELEASE_ARCH"*"GOOS=windows"*) ;;
            *) echo "::error::Windows artifact architecture does not match windows/$RELEASE_ARCH"; exit 1 ;;
          esac

      - name: Build macOS (Universal)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.PUBLISHER_PUBLIC_KEY }}
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" CXX="clang++ -arch x86_64" \
            go build -v -o mbii-foundry_amd64 -ldflags="-s -w -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" CXX="clang++ -arch arm64" \
            go build -v -o mbii-foundry_arm64 -ldflags="-s -w -X=main.PublisherTrustedKey=$PUBLISHER_PUBLIC_KEY"
          test "$(lipo -archs mbii-foundry_amd64)" = "x86_64"
          test "$(lipo -archs mbii-foundry_arm64)" = "arm64"
          lipo -create -output mbii-foundry mbii-foundry_amd64 mbii-foundry_arm64
          lipo mbii-foundry -verify_arch x86_64 arm64
          ARCHS="$(lipo -archs mbii-foundry)"
          test "$(wc -w <<<"$ARCHS" | tr -d ' ')" = "2"

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          APP_BUNDLE="MBII Foundry.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp go_module/mbii-foundry "$APP_BUNDLE/Contents/MacOS/"
          cp macos/Info.plist "$APP_BUNDLE/Contents/"
          cp macos/AppIcon.icns "$APP_BUNDLE/Contents/Resources/"
          for dir in data definitions schemas templates; do
            if [ ! -d "$dir" ]; then
              echo "::error::Required release resource directory '$dir' is missing."
              exit 1
            fi
            cp -R "$dir" "$APP_BUNDLE/Contents/Resources/"
          done
          # Signing policy (fails closed, never claims Apple trust):
          # - MACOS_DEVELOPER_IDENTITY secret set → sign with Developer ID.
          #   (Notarization is NOT performed here; the release notes must
          #   not claim it without stapled proof.)
          # - Otherwise → ad-hoc sign so the bundle is structurally
          #   consistent for the updater's codesign --verify check. This
          #   confers NO Gatekeeper trust; users bypass it on first launch.
          if [ -n "$MACOS_DEVELOPER_IDENTITY" ]; then
            codesign -s "$MACOS_DEVELOPER_IDENTITY" -f --deep --strict "$APP_BUNDLE"
            echo "Signed with Developer ID identity (notarization NOT performed)"
          else
            echo "::warning::MACOS_DEVELOPER_IDENTITY is not set — signing AD-HOC. No Apple Developer ID trust, no notarization; Gatekeeper will flag first launch."
            codesign -s - -f --deep --strict "$APP_BUNDLE"
          fi
          codesign --verify --deep --strict "$APP_BUNDLE"
          zip -qr "mbii-foundry-${{ matrix.name }}.zip" "$APP_BUNDLE"
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          mkdir -p dist
          cp go_module/mbii-foundry dist/
          cp README.md LICENSE USER_GUIDE.md dist/
          cp -r data definitions schemas templates dist/
          tar -czf "mbii-foundry-${{ matrix.name }}.tar.gz" -C dist .

      - name: Package Windows zip
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item go_module/mbii-foundry.exe dist/
          Copy-Item README.md, LICENSE, USER_GUIDE.md dist/
          Copy-Item -Recurse data, definitions, schemas, templates dist/
          Compress-Archive -Path dist/* -DestinationPath "mbii-foundry-${{ matrix.name }}.zip" -Force

      - name: Sign manifest
        working-directory: go_module
        shell: bash
        env:
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          go build -o signer ./cmd/signer
          umask 077
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR" signer' EXIT
          printf '%s' "$PUBLISHER_PRIVATE_KEY" > "$KEY_DIR/private.hex"
          ./signer -sign "../mbii-foundry-${{ matrix.name }}.${{ matrix.archive_ext }}" \
                   -key "$KEY_DIR/private.hex" \
                   -version "$GITHUB_REF_NAME" \
                   -platform "$RELEASE_PLATFORM" \
                   -arch "$RELEASE_ARCH"

      - uses: actions/upload-artifact@v7
        with:
          name: mbii-foundry-${{ matrix.name }}
          path: |
            mbii-foundry-${{ matrix.name }}.*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
